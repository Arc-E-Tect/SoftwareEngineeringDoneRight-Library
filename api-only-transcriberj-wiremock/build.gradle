/*
 * The WireMock emitter of the Arc-E-Tect API-Only TranscriberJ: WireMock stubs that answer as the
 * contract says -- an exact stub for every contract case, and fallbacks for every other request --
 * written as mapping files to be packaged and handed to the API's consumers, or as Java.
 * Publish: ./gradlew publishToMavenLocal
 */
plugins {
    id 'jacoco'
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.jreleaser)
    alias(libs.plugins.owaspDependencycheck)
}

java {
    toolchain {
        // 21, as the TranscriberJ: an emitter runs inside the consumer's Gradle JVM.
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
    // The API-Only TranscriberJ, and the API-Only Subscriber it depends on.
    gradlePluginPortal()
}

dependencies {
    // The emitter interface is part of the plugin, which provides it when it loads
    // the emitter; so it is compiled against, and never shipped with the emitter.
    compileOnly libs.api.only.transcriberj

    testImplementation libs.api.only.transcriberj
    // WireMock with its dependencies shaded: its JSON Schema matcher needs json-schema-validator 1.x,
    // while the tests' independent oracle is 3.x.
    testImplementation libs.wiremock.standalone
    // The tests compile generated code, which carries the coverage marker annotation.
    testImplementation libs.sedr.library
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    // The REST Docs emitter's rendered tests, run in-process against WireMock through the
    // JUnit Platform Launcher, with REST Docs' WebTestClient integration.
    testImplementation libs.api.only.transcriberj.restdocs
    testImplementation libs.spring.restdocs.core
    testImplementation libs.spring.restdocs.webtestclient
    testImplementation libs.junit.platform.launcher
    testImplementation libs.apiguardian.api
    // The oracle the stubs' response bodies are judged by, independent of the generator.
    testImplementation libs.json.schema.validator
    testImplementation libs.snakeyaml.engine
    testRuntimeOnly    libs.joni
    // The contract-evidence scan the API-Only Suite runs over test sources.
    testImplementation libs.doppelganger.api.detector
    testImplementation libs.api.detector.core
    // The TranscriberJ's check of a managed dependency's resolved version, which the tests call as
    // the plugin does, refers to Gradle's API.
    testRuntimeOnly    gradleApi()
    // A consumer build of the TranscriberJ with this emitter, which packages the archive (T21.12),
    // and the image built from it, run in Docker (T21.2).
    testImplementation gradleTestKit()
    testImplementation libs.testcontainers.core
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'API-Only TranscriberJ WireMock Emitter'
                description = 'WireMock stubs that answer as an API contract says, generated by the Arc-E-Tect API-Only TranscriberJ: an early, specification-compliant draft of the API, packaged for its consumers, and the reference double for contract tests in any language.'
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'ieising'
                        name = 'Iwan Eising'
                        email = 'iwan@arc-e-tect.com'
                        organizationUrl = 'https://github.com/Arc-E-Tect'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library.git'
                    developerConnection = 'scm:git:ssh://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library.git'
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'StagingDeploy'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

dependencyCheck {
    nvd {
        apiKey = System.getenv('NVD_APIKEY_SEDR') ?: System.getenv('NVD_APIKEY')
    }
    failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
    analyzers {
        nodeAuditEnabled = false
        nodeEnabled = false
    }
    format = 'HTML'
}

jreleaser {
    gitRootSearch = true
    signing {
        active = 'ALWAYS'
        armored = true
        mode = 'MEMORY'
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepositories = ['build/staging-deploy']
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
    // The consumer build loads the emitter from its jar, and the TranscriberJ at the version built
    // against; the image is of the WireMock version the tests use.
    dependsOn tasks.named('jar')
    def emitterJar = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(emitterJar).withPropertyName('emitterJar')
    systemProperty 'wiremock.version', libs.versions.wiremock.get()
    systemProperty 'transcriberj.version', libs.versions.api.only.transcriberj.asProvider().get()
    jvmArgumentProviders.add({ ["-Demitter.jar=${emitterJar.get().asFile.absolutePath}".toString()] } as CommandLineArgumentProvider)
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    finalizedBy jacocoTestReport
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    // No exclusions, as for the TranscriberJ itself.
    violationRules {
        rule {
            limit {
                minimum = 0.9
            }
        }
    }
}

tasks.named('javadoc') {
    options {
        encoding = 'UTF-8'
        addBooleanOption('Xdoclint:all', true)
        addBooleanOption('Xwerror', true)
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification, javadoc
}
