## Generated by $ ./gradlew refreshVersionsCatalog

[plugins]

jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
owaspDependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owaspDependencycheck" }

[versions]

jreleaser = "1.26.0"
owaspDependencycheck = "13.0.0"

junit-jupiter = "6.1.3"
junit-platform = "6.1.3"
assertj = "3.27.7"
# The API-Only TranscriberJ this emitter is built against; its emitter interface, and the
# operation id and declared parameters each invalid-request case carries, are part of the
# plugin artifact, published to the Gradle Plugin Portal.
api-only-transcriberj = "0.10.0"
# The WireMock the generated stubs are tested with; also the version the plugin adds to a
# project that declares none (WireMockEmitter.dependencies()): the one wiremock-spring-boot
# 4.4.1 brings.
wiremock = "3.13.2"
# The REST Docs emitter whose rendered invalid-request tests the tests here run against the
# generated stubs, and what those tests need: Spring REST Docs with its WebTestClient
# integration, which brings spring-test and spring-webflux.
api-only-transcriberj-restdocs = "0.2.0"
spring-restdocs = "4.0.1"
# The marker annotation the generated code carries, so a coverage rule does not measure
# code nobody wrote. The TranscriberJ manages it for the projects it generates into; the
# tests here need it because they compile that generated code.
sedr-library = "1.0.0"
# What JUnit's own annotations refer to: on the compile classpath, so that compiling the
# rendered tests with -Xlint:all reports nothing about JUnit's class files.
apiguardian = "1.1.2"
# The independent JSON Schema 2020-12 validator the TranscriberJ's own tests use as their
# oracle, and what it reads contracts with: the stubs' response bodies are judged by it.
json-schema-validator = "3.0.7"
joni = "2.2.6"
snakeyaml-engine = "3.1.1"
# The Doppelganger API Detector, whose contract-evidence scan must not count a stub as a test.
doppelganger-api-detector = "2.10.1"
api-detector-core = "1.8.0"

[libraries]

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
api-only-transcriberj = { module = "com.arc-e-tect:api-only-transcriberj", version.ref = "api-only-transcriberj" }
api-only-transcriberj-restdocs = { module = "com.arc-e-tect:api-only-transcriberj-restdocs", version.ref = "api-only-transcriberj-restdocs" }
wiremock-jetty12 = { module = "org.wiremock:wiremock-jetty12", version.ref = "wiremock" }
spring-restdocs-core = { module = "org.springframework.restdocs:spring-restdocs-core", version.ref = "spring-restdocs" }
spring-restdocs-webtestclient = { module = "org.springframework.restdocs:spring-restdocs-webtestclient", version.ref = "spring-restdocs" }
sedr-library = { module = "com.arc-e-tect.sedr.utils:sedr-library", version.ref = "sedr-library" }
apiguardian-api = { module = "org.apiguardian:apiguardian-api", version.ref = "apiguardian" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
joni = { module = "org.jruby.joni:joni", version.ref = "joni" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
doppelganger-api-detector = { module = "com.arc-e-tect:doppelganger-api-detector", version.ref = "doppelganger-api-detector" }
api-detector-core = { module = "com.arc-e-tect:api-detector-core", version.ref = "api-detector-core" }
