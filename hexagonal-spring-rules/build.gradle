/*
 * Build file for architecture-validator-hexagonal-spring-rules.
 * Version: gradle.properties when not prerelease, HEXAGONAL_SPRING_RULES_VERSION
 *          env var (CI), latest matching GitHub release tag (local dev, requires
 *          gh CLI), or 1.0.0-PRERELEASE as fallback.
 */
plugins {
    id 'jacoco'
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    alias(libs.plugins.owasp.dependency.check.iff)
    alias(libs.plugins.jreleaser.iff)
}

group = rootProject.group

def resolveVersion = {
    def propsVersion = rootProject.version as String
    if (propsVersion != '1.0.0-PRERELEASE') {
        logger.lifecycle('[hexagonal-spring-rules] version from gradle.properties: ' + propsVersion)
        return propsVersion
    }

    def envVersion = System.getenv('HEXAGONAL_SPRING_RULES_VERSION')
    if (envVersion) {
        logger.lifecycle('[hexagonal-spring-rules] version from HEXAGONAL_SPRING_RULES_VERSION: ' + envVersion)
        return envVersion
    }

    try {
        def cmd = ['gh', 'release', 'list',
                   '--repo', 'Arc-E-Tect/SoftwareEngineeringDoneRight-Library',
                   '--limit', '100',
                   '--json', 'tagName',
                   '--jq', '.[] | .tagName']
        def proc = cmd.execute()
        proc.waitForOrKill(10_000)
        def tag = proc.text.readLines()
            .findAll { it.startsWith('architecture-validator-hexagonal-spring-rules-v') || it.startsWith('spring-rules-v') }
            .sort()
            .last()

        if (tag) {
            def v = tag
                .replaceFirst(/^architecture-validator-hexagonal-spring-rules-v/, '')
                .replaceFirst(/^spring-rules-v/, '')
            logger.lifecycle('[hexagonal-spring-rules] version from GitHub release: ' + v)
            return v
        }
    } catch (Exception ignored) {
        logger.lifecycle('[hexagonal-spring-rules] GitHub CLI query failed, using 1.0.0-PRERELEASE')
    }

    logger.lifecycle('[hexagonal-spring-rules] No release found, using 1.0.0-PRERELEASE')
    return '1.0.0-PRERELEASE'
}

version = resolveVersion()

base {
    archivesName = 'architecture-validator-hexagonal-spring-rules'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

jacoco {
}

repositories {
    mavenCentral()
}

dependencyCheck {
    failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
    nvd {
        apiKey = System.getenv('NVD_APIKEY_SEDR')
    }
    analyzers {
        nodeAuditEnabled = false
        nodeEnabled = false
    }
}

dependencies {
    api libs.archunit.junit5.iff
    compileOnly libs.spring.context.iff
    compileOnly libs.junit.jupiter.iff

    testFixturesImplementation libs.spring.context.iff

    testImplementation libs.junit.jupiter.iff
    testImplementation(testFixtures(project))
    testRuntimeOnly libs.junit.platform.launcher.iff
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'architecture-validator-hexagonal-spring-rules'
            pom {
                name = 'Architecture Validation Spring Rules'
                description = 'Companion Spring Hexagonal architecture rules for the Architecture Validator plugin. Add com.arc-e-tect.architecture-validator:architecture-validator-hexagonal-spring-rules as a testArchitectureImplementation dependency to activate Spring stereotype rules.'
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'ieising'
                        name = 'Iwan Eising'
                        email = 'iwan@arc-e-tect.com'
                        organizationUrl = 'https://github.com/Arc-E-Tect'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library.git'
                    developerConnection = 'scm:git:ssh://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library.git'
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library'
                }
                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library/issues'
                }
                ciManagement {
                    system = 'GitHub Actions'
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library/actions'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
        maven {
            name = 'StagingDeploy'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

jreleaser {
    gitRootSearch = true
    signing {
        active = 'ALWAYS'
        armored = true
        mode = 'MEMORY'
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepositories = ['build/staging-deploy']
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PACKAGE
    options.addBooleanOption('html5', true)
    options.addStringOption('Xdoclint:none', '-quiet')
    options.links('https://docs.oracle.com/javase/21/docs/api/')
    options.docTitle = "Architecture Validator Spring Rules API"
    options.windowTitle = "Spring Hexagonal Architecture Rules (${project.version})"
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}