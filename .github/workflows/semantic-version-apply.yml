name: Semantic Version - Apply
on:
  workflow_call:
    inputs:
      project_dir:
        description: 'Directory where the Semantic Release configuration is located'
        type: string
        required: false
      DEBUG:
        description: 'Run the workflow in debug mode'
        type: boolean
        required: false
        default: false
    outputs:
      release_notes:
        description: 'Release notes generated by semantic-release'
        value: ${{ jobs.Apply-Version.outputs.release_notes }}
      released_version:
        description: >-
          The version semantic-release tagged and released in this run, or empty when it released
          nothing (for example because another module's release moved the branch on first).
          Publish only when this equals the calculated version.
        value: ${{ jobs.Apply-Version.outputs.released_version }}
    secrets:
      sem_rel_token_token:
        required: true

permissions:
  contents: read

jobs:
  Apply-Version:
    name: Apply Version

    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      release_notes: ${{ steps.extract_notes.outputs.release_notes }}
      released_version: ${{ steps.apply_release.outputs.released_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          clean: false
          persist-credentials: false
        env:
          GITHUB_TOKEN: ${{ secrets.sem_rel_token_token }}

      - name: cache NPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Set PROJECT_DIR environment variable
        if: ${{ inputs.project_dir != '' }}
        run: echo "PROJECT_DIR=${{ inputs.project_dir }}" >> "$GITHUB_ENV"

      - name: Install Semantic Release
        run: |
          cd ${{ env.PROJECT_DIR || '.' }}
          npm ci

      - name: Apply release
        id: apply_release
        run: |
          set -o pipefail
          cd ${{ env.PROJECT_DIR || '.' }}
          npx semantic-release 2>&1 | tee "$RUNNER_TEMP/semantic-release.log"
          # One merge can start several modules' release workflows at once. The first to release
          # pushes its release commit, and semantic-release in every other one then finds its
          # branch behind the remote and releases nothing, without failing. Only a version this
          # run really tagged may be published, so it is read from semantic-release's own output.
          # "Release X published on <channel>" (semantic-release 25 and later), or "Published release X".
          RELEASED_VERSION=$(sed -nE -e 's/.*Release ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?) published on .*/\1/p' -e 's/.*Published release ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?) .*/\1/p' "$RUNNER_TEMP/semantic-release.log" | head -1)
          echo "released_version=${RELEASED_VERSION}" >> "$GITHUB_OUTPUT"
          if [ -z "$RELEASED_VERSION" ]; then
            if grep -q 'is behind the remote one' "$RUNNER_TEMP/semantic-release.log"; then
              echo "::warning title=Release skipped::Another release moved ${{ github.ref_name }} on first; nothing was tagged, so nothing will be published. The next push that changes this module releases it."
            fi
            echo "Released version: none"
          else
            echo "Released version: ${RELEASED_VERSION}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.sem_rel_token_token }}
          GIT_COMMITTER_NAME: "Arc-E-Tect Versioning bot"
          GIT_COMMITTER_EMAIL: "sedr@arc-e-tect.com"
          GIT_AUTHOR_NAME: "Arc-E-Tect Versioning bot"
          GIT_AUTHOR_EMAIL: "sedr@arc-e-tect.com"

      - name: Pull latest changes including CHANGELOG
        run: |
          cd ${{ env.PROJECT_DIR || '.' }}
          git pull https://x-access-token:${{ secrets.sem_rel_token_token }}@github.com/${{ github.repository }}.git ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.sem_rel_token_token }}

      - name: Extract release notes
        id: extract_notes
        uses: ./.github/actions/extract-release-notes
        with:
          project_dir: ${{ env.PROJECT_DIR || '.' }}
          max_length: '1500'