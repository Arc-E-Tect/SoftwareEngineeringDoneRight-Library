name: Example - Microcks Async Minion Cold Consumer Timeout
# Reproduces a Microcks async minion issue on a GitHub-hosted runner, on request only: while
# the issue exists, the example's first test is expected to fail. See the example's README.adoc.
on:
  workflow_dispatch:
    inputs:
      minion_cpus:
        description: 'CPUs for the async minion container, e.g. 0.15; empty for no limit'
        required: false
        default: ''
      runs:
        description: 'How many times to run the example, each on fresh containers'
        required: false
        default: '5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Reproduce:
    name: Reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run the example
        env:
          MINION_CPUS: ${{ inputs.minion_cpus }}
          RUNS: ${{ inputs.runs }}
        run: |
          cd examples/microcks/async-minion-cold-consumer-timeout
          chmod +x ./gradlew
          ARGS=()
          [ -n "$MINION_CPUS" ] && ARGS+=("-PminionCpus=$MINION_CPUS")
          failed=0
          for run in $(seq 1 "$RUNS"); do
            echo "::group::Run $run of $RUNS"
            ./gradlew test --no-daemon "${ARGS[@]}" || failed=$((failed + 1))
            echo "::endgroup::"
          done
          echo "::notice title=Result::$failed of $RUNS runs failed"
          [ "$failed" -eq 0 ]
