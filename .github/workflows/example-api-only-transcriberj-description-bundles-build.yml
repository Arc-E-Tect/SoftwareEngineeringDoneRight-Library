name: Example - API-Only TranscriberJ Description Bundles Build
on:
  push:
    paths:
      - 'examples/api-only-transcriberj/description-bundles/**/*.java'
      - 'examples/api-only-transcriberj/description-bundles/**/*.yaml'
      - 'examples/api-only-transcriberj/description-bundles/**/*.gradle'
      - 'examples/api-only-transcriberj/description-bundles/**/*.properties'
      - 'examples/api-only-transcriberj/description-bundles/**/libs.versions.toml'
      - 'examples/api-only-transcriberj/description-bundles/package.json'
      - 'examples/api-only-transcriberj/description-bundles/package-lock.json'
      - '.github/workflows/example-api-only-transcriberj-description-bundles-build.yml'

permissions:
  contents: read

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      # The example builds its contract with the API-Only Publisher, which is a Node.js tool.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build example
        run: |
          cd examples/api-only-transcriberj/description-bundles
          chmod +x ./gradlew
          ./gradlew test --no-daemon
