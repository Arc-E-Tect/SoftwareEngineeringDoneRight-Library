name: Architecture Validator Spring Rules - Security Scan
on:
  schedule:
    - cron: '0 8 * * 5'  # Every Friday at 08:00 UTC
  workflow_dispatch:
    inputs:
      force_nvd_refresh:
        description: 'Force dependencyCheckUpdate before analyze'
        type: boolean
        required: false
        default: false

jobs:
  Read-Version:
    name: Read Current Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read version from gradle.properties
        id: read-version
        run: |
          VERSION=$(grep -oP 'version\s*=\s*\K\S+' hexagonal-spring-rules/gradle.properties)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  Security-Scan:
    needs: Read-Version
    uses: ./.github/workflows/security-scan.yml
    with:
      project_name: 'hexagonal-spring-rules'
      semantic_version: ${{ needs.Read-Version.outputs.version }}
      fail_on_fatal: true
      force_nvd_refresh: ${{ github.event_name == 'workflow_dispatch' && inputs.force_nvd_refresh || false }}
      reports_subpath: build/reports
    secrets:
      NVD_APIKEY_SEDR: ${{ secrets.NVD_APIKEY_SEDR }}
