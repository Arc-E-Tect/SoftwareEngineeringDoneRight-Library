/*
 * Build file for geo-tracker-lens-pack.
 * Version: gradle.properties when not prerelease, GEO_TRACKER_LENS_PACK_VERSION env var
 *          (CI), latest matching GitHub release tag (local dev, requires gh CLI), or
 *          0.0.1-PRERELEASE as fallback.
 */
plugins {
    id 'jacoco'
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.jreleaser)
    alias(libs.plugins.owaspDependencycheck)
}

def resolveVersion = {
    def propsVersion = project.version as String
    if (propsVersion != '0.0.1-PRERELEASE') {
        logger.lifecycle('[geo-tracker-lens-pack] version from gradle.properties: ' + propsVersion)
        return propsVersion
    }

    def envVersion = System.getenv('GEO_TRACKER_LENS_PACK_VERSION')
    if (envVersion) {
        logger.lifecycle('[geo-tracker-lens-pack] version from GEO_TRACKER_LENS_PACK_VERSION: ' + envVersion)
        return envVersion
    }

    try {
        def cmd = ['gh', 'release', 'list',
                   '--repo', 'Arc-E-Tect/SoftwareEngineeringDoneRight-Library',
                   '--limit', '100',
                   '--json', 'tagName',
                   '--jq', '.[] | .tagName']
        def proc = cmd.execute()
        proc.waitForOrKill(10_000)
        def tag = proc.text.readLines()
            .findAll { it.startsWith('geo-tracker-lens-pack-v') }
            .sort()
            .last()

        if (tag) {
            def v = tag.replaceFirst(/^geo-tracker-lens-pack-v/, '')
            logger.lifecycle('[geo-tracker-lens-pack] version from GitHub release: ' + v)
            return v
        }
    } catch (Exception ignored) {
        logger.lifecycle('[geo-tracker-lens-pack] GitHub CLI query failed, using 0.0.1-PRERELEASE')
    }

    logger.lifecycle('[geo-tracker-lens-pack] No release found, using 0.0.1-PRERELEASE')
    return '0.0.1-PRERELEASE'
}

version = resolveVersion()

group = 'com.arc-e-tect'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

jacoco {
}

repositories {
    mavenCentral()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'geo-tracker-lens-pack'
            pom {
                name = 'Geo Tracker Lens Pack'
                description = 'Geography-inspired lens pack for the Tracker Lens plugin. Add com.arc-e-tect:geo-tracker-lens-pack as a lensStyle dependency to activate the pack.'
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'ieising'
                        name = 'Iwan Eising'
                        email = 'iwan@arc-e-tect.com'
                        organizationUrl = 'https://github.com/Arc-E-Tect'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library.git'
                    developerConnection = 'scm:git:ssh://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library.git'
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library'
                }
                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library/issues'
                }
                ciManagement {
                    system = 'GitHub Actions'
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library/actions'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'StagingDeploy'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

dependencyCheck {
    nvd {
        apiKey = System.getenv('NVD_APIKEY_SEDR') ?: System.getenv('NVD_APIKEY')
    }
    failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
    analyzers {
        nodeAuditEnabled = false
        nodeEnabled = false
    }
    format = 'HTML'
}

jreleaser {
    gitRootSearch = true
    signing {
        active = 'ALWAYS'
        armored = true
        mode = 'MEMORY'
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepositories = ['build/staging-deploy']
                }
            }
        }
    }
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}