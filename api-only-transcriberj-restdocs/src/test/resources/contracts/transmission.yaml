# Every parameter and the body carry a value with a space, '+', '&', '=' and '%', and all but the
# header a non-ASCII character -- header values are US-ASCII -- as a const, so that every case's
# request holds them; the invalid-request response is a closed problem with required members.
openapi: 3.1.0
