        - {name: tag, in: query, required: true, schema: {type: string, const: 'x y+z&w=v%u ü'}}
        - {name: page, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: X-Label, in: header, required: true, schema: {type: string, const: 'h i+j&k=l%m'}}
        - {name: X-Count, in: header, required: true, schema: {type: integer, maximum: 5}}
