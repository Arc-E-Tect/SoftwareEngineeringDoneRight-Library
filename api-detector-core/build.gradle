/*
 * Build file for api-detector-core - shared domain model and scanning logic for the SEDR
 * API detector Gradle plugins (Shadow, Mirage, Doppelganger API Detector).
 * Version: API_DETECTOR_CORE_VERSION env var (CI), latest api-detector-core-v* GitHub tag
 *          (local dev, requires gh CLI), or 1.0.0-PRERELEASE (fallback).
 * Publish: ./gradlew publishToMavenLocal
 */
plugins {
    id 'jacoco'
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.jreleaser)
    alias(libs.plugins.owaspDependencycheck)
}

def resolveVersion = {
    def propsVersion = project.version as String
    if (propsVersion != '1.0.0-PRERELEASE') {
        logger.lifecycle('[api-detector-core] version from gradle.properties: ' + propsVersion)
        return propsVersion
    }
    def envVersion = System.getenv('API_DETECTOR_CORE_VERSION')
    if (envVersion) {
        logger.lifecycle('[api-detector-core] version from API_DETECTOR_CORE_VERSION: ' + envVersion)
        return envVersion
    }
    try {
        def cmd = ['gh', 'release', 'list',
                   '--repo', 'Arc-E-Tect/SoftwareEngineeringDoneRight-Library',
                   '--limit', '50',
                   '--json', 'tagName',
                   '--jq', '.[] | select(.tagName | startswith("api-detector-core-v")) | .tagName']
        def proc = cmd.execute()
        proc.waitForOrKill(10_000)
        def tag = proc.text.readLines().findAll { it.startsWith('api-detector-core-v') }
                          .sort()
                          .last()
        if (tag) {
            def v = tag.replaceFirst(/^api-detector-core-v/, '')
            logger.lifecycle('[api-detector-core] version from GitHub release: ' + v)
            return v
        }
    } catch (Exception ignored) {
        logger.lifecycle('[api-detector-core] GitHub CLI query failed, using 1.0.0-PRERELEASE')
    }
    logger.lifecycle('[api-detector-core] No release found, using 1.0.0-PRERELEASE')
    return '1.0.0-PRERELEASE'
}

version = resolveVersion()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

jacoco {
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.javaparser.core
    implementation libs.swagger.parser

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly    libs.junit.platform.launcher
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'API Detector Core'
                description = 'Shared domain model and scanning logic for the SEDR API detector Gradle plugins (Shadow API Detector, Mirage API Detector, Doppelganger API Detector).'
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'ieising'
                        name = 'Iwan Eising'
                        email = 'iwan@arc-e-tect.com'
                        organizationUrl = 'https://github.com/Arc-E-Tect'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library.git'
                    developerConnection = 'scm:git:ssh://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library.git'
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Library'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'StagingDeploy'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

dependencyCheck {
    nvd {
        apiKey = System.getenv('NVD_APIKEY_SEDR') ?: System.getenv('NVD_APIKEY')
    }
    failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
    analyzers {
        nodeAuditEnabled = false
        nodeEnabled = false
    }
    format = 'HTML'
}

jreleaser {
    gitRootSearch = true
    signing {
        active = 'ALWAYS'
        armored = true
        mode = 'MEMORY'
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepositories = ['build/staging-deploy']
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}
