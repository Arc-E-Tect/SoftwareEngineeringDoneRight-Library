/*
 * Example project demonstrating the sedr-library jacoco-marker annotation
 * and the reusable ArchUnit convention test shipped as a test-fixtures artifact.
 *
 * Run the example (intentionally fails to demonstrate the ArchUnit check):
 *   ./gradlew test
 */
plugins {
    id 'jacoco'
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(libs.sedr.library)
    testImplementation(testFixtures(libs.sedr.library))
    testRuntimeOnly(libs.junit.jupiter.engine)
    testRuntimeOnly(libs.junit.platform.launcher)
}

test {
    useJUnitPlatform()
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}
