get:
  operationId: getOrder
  summary: Get one order.
  parameters:
    - name: orderId
      in: path
      required: true
      description: The order's identifier.
      schema:
        type: string
  responses:
    '200':
      description: The order.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrderV1.yaml
    '404':
      description: No order has that identifier.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ProblemV1.yaml
