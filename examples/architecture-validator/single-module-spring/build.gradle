plugins {
    id 'jacoco'
    id 'java'
    alias(libs.plugins.architecture.validator.iff)
}

group = 'com.arc-e-tect.example.spring'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.context.iff
    testArchitectureImplementation libs.architecture.validator.hexagonal.spring.rules.iff
}

architectureValidator {
    basePackage = 'com.arc_e_tect.example.spring'
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('testArchitecture', Test) {
    // Make architecture-rule failures fail the task even if a higher-level script tries to relax test failures.
    ignoreFailures = false
}

tasks.named('check') {
    dependsOn tasks.named('testArchitecture')
}